<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vote warna Oximeter FOX 1</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    margin: 0;
    background: #f1efe8;
    color: #111;
  }
  .wrap { max-width: 380px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 19px; margin: 0 0 4px; font-weight: 500; }
  .sub { font-size: 13px; color: #666; margin: 0 0 16px; }
  .slot {
    border: 0.5px solid #d8d5cb; border-radius: 8px; padding: 8px 10px;
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
  }
  .slot .lbl { font-size: 12px; color: #999; }
  .slot .val { color: #444; }
  .slot button { background: transparent; border: none; color: #999; padding: 2px; cursor: pointer; font-size: 16px; }

  .photo-wrap { position: relative; width: 100%; aspect-ratio: 1/1; border-radius: 16px; overflow: hidden; }
  .photo-layer {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    opacity: 0; transform: translateX(-28px);
    transition: opacity .55s ease, transform .55s cubic-bezier(.4,0,.2,1);
    z-index: 1;
  }
  .photo-layer.active { opacity: 1; transform: translateX(0); z-index: 2; }
  .photo-layer img { max-width: 84%; max-height: 84%; object-fit: contain; }

  .nav-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(255,255,255,0.75); border: none; border-radius: 50%;
    width: 32px; height: 32px; cursor: pointer; font-size: 16px; z-index: 3;
  }
  .nav-btn.prev { left: 8px; } .nav-btn.next { right: 8px; }
  .cname { font-size: 18px; font-weight: 500; margin: 14px 0 4px; text-align: center; }
  .ckesan { font-size: 13px; color: #666; margin: 0 0 16px; text-align: center; }
  .pick-row { display: flex; gap: 8px; margin-bottom: 6px; }
  .pick-row button {
    flex: 1; padding: 10px; border-radius: 8px; border: 0.5px solid #ccc;
    background: #fff; font-size: 13px; cursor: pointer;
  }
  .pick-row button:disabled { opacity: 0.4; }
  .dots { text-align: center; font-size: 11px; color: #999; margin: 10px 0 18px; }
  #submitBtn {
    width: 100%; padding: 14px; border-radius: 999px; border: none;
    background: #111; color: #fff; font-size: 15px; cursor: pointer;
  }
  #submitBtn:disabled { opacity: 0.5; }
  .msg { font-size: 12px; margin-top: 8px; text-align: center; }
  .msg.err { color: #b23; }
  .msg.info { color: #666; }
  .hidden { display: none !important; }
  .loading { text-align: center; color: #999; font-size: 13px; padding: 40px 0; }

  .live { margin-top: 20px; padding-top: 16px; border-top: 0.5px solid #d8d5cb; }
  .liveTitle { font-size: 13px; font-weight: 500; margin: 0 0 10px; color: #333; }
  .liveCol { margin-bottom: 14px; }
  .liveLabel { font-size: 11px; color: #999; margin: 0 0 6px; text-transform: uppercase; letter-spacing: .02em; }
  .liveRow { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .liveRow .rank { font-size: 11px; color: #999; width: 12px; }
  .liveRow .sw { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; border: 0.5px solid #ddd; }
  .liveRow .info { flex: 1; min-width: 0; }
  .liveRow .name { font-size: 11px; margin: 0 0 3px; color: #333; }
  .liveRow .bar { background: #f1efe8; border-radius: 4px; height: 4px; overflow: hidden; }
  .liveRow .bar-fill { height: 100%; transition: width .8s ease; }
  .liveRow .pct { font-size: 10px; color: #999; width: 28px; text-align: right; }
  .liveEmpty { font-size: 11px; color: #999; margin: 0; }
  .liveTotal { font-size: 11px; color: #999; margin: 8px 0 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Vote warna Oximeter FOX 1</h1>
  <p class="sub">Pilih 2 warna: satu maskulin, satu feminin</p>
  <div id="loadingMsg" class="loading">Memuat data warna...</div>
  <div id="app" class="hidden">

    <div class="slot"><span class="lbl">Maskulin: <span class="val" id="slotMLabel">belum dipilih</span></span>
      <button id="undoM" class="hidden" aria-label="Batalkan">&times;</button></div>
    <div class="slot"><span class="lbl">Feminin: <span class="val" id="slotFLabel">belum dipilih</span></span>
      <button id="undoF" class="hidden" aria-label="Batalkan">&times;</button></div>

    <div id="card">
      <div class="photo-wrap" id="photoWrap">
        <button class="nav-btn prev" id="prevBtn" aria-label="Sebelumnya">&#8249;</button>
        <button class="nav-btn next" id="nextBtn" aria-label="Berikutnya">&#8250;</button>
      </div>
      <p class="cname" id="cName"></p>
      <p class="ckesan" id="cKesan"></p>
      <div class="pick-row">
        <button id="pickM">Tandai maskulin</button>
        <button id="pickF">Tandai feminin</button>
      </div>
    </div>

    <p class="dots" id="dots"></p>

    <button id="submitBtn">Kirim vote</button>
    <p class="msg err hidden" id="errMsg"></p>
    <p class="msg info hidden" id="lockedMsg">Vote sudah terkirim. Pilihan tidak bisa diubah lagi.</p>

    <div class="live" id="liveResults">
      <p class="liveTitle">Hasil sementara</p>
      <div class="liveCol">
        <p class="liveLabel">Top maskulin</p>
        <div id="liveM"></div>
      </div>
      <div class="liveCol">
        <p class="liveLabel">Top feminin</p>
        <div id="liveF"></div>
      </div>
      <p class="liveTotal" id="liveTotal"></p>
    </div>

  </div>
</div>

<script>
  // ISI DENGAN URL WEB APP APPS SCRIPT KAMU (hasil Deploy > Web app)
  var API_URL = 'https://script.google.com/macros/s/AKfycbxo8klY5jDPAHeSpgKVdZ9jG5AlP8Fd6aWqnVUhFABPkuXpL61j12uq7LF_kwIBTTsLnQ/exec';

  var candidates = [];
  var idx = 0;
  var slots = { m: null, f: null };
  var locked = false;
  var auto = null;
  var liveTimer = null;
  var layers = [];
  var SLIDE_MS = 560;

  var photoWrap = document.getElementById('photoWrap');
  var cName = document.getElementById('cName');
  var cKesan = document.getElementById('cKesan');
  var dots = document.getElementById('dots');
  var slotMLabel = document.getElementById('slotMLabel');
  var slotFLabel = document.getElementById('slotFLabel');
  var undoM = document.getElementById('undoM');
  var undoF = document.getElementById('undoF');
  var pickM = document.getElementById('pickM');
  var pickF = document.getElementById('pickF');
  var submitBtn = document.getElementById('submitBtn');
  var errMsg = document.getElementById('errMsg');
  var lockedMsg = document.getElementById('lockedMsg');
  var card = document.getElementById('card');
  var loadingMsg = document.getElementById('loadingMsg');
  var app = document.getElementById('app');
  var liveM = document.getElementById('liveM');
  var liveF = document.getElementById('liveF');
  var liveTotal = document.getElementById('liveTotal');

  function getToken() {
    var t = localStorage.getItem('voteToken_fox1');
    if (!t) {
      t = 'v_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
      localStorage.setItem('voteToken_fox1', t);
    }
    return t;
  }
  var token = getToken();

  function buildLayers() {
    candidates.forEach(function (c, i) {
      var layer = document.createElement('div');
      layer.className = 'photo-layer' + (i === 0 ? ' active' : '');
      layer.style.background = c.hex;
      // posisi tunggu default: di sebelah KIRI, siap masuk ke kanan saat tombol "next" (kanan) ditekan
      layer.style.transform = i === 0 ? 'translateX(0)' : 'translateX(-28px)';
      var img = document.createElement('img');
      img.src = c.img;
      img.alt = c.name;
      img.onerror = function () { img.style.display = 'none'; };
      layer.appendChild(img);
      photoWrap.insertBefore(layer, photoWrap.firstChild);
      layers.push(layer);
    });
  }

  function updateMeta() {
    var c = candidates[idx];
    cName.textContent = c.name;
    cKesan.textContent = c.kesan;
    dots.textContent = (idx + 1) + ' / ' + candidates.length;
    slotMLabel.textContent = slots.m === null ? 'belum dipilih' : candidates[slots.m].name;
    slotFLabel.textContent = slots.f === null ? 'belum dipilih' : candidates[slots.f].name;
    undoM.classList.toggle('hidden', slots.m === null || locked);
    undoF.classList.toggle('hidden', slots.f === null || locked);
    pickM.textContent = slots.m === idx ? 'Batal maskulin' : 'Tandai maskulin';
    pickF.textContent = slots.f === idx ? 'Batal feminin' : 'Tandai feminin';
    pickM.disabled = locked || slots.f === idx;
    pickF.disabled = locked || slots.m === idx;
  }

  // dir: +1 = "kanan" (next)  -> animasi bergerak ke KANAN (lama keluar kanan, baru masuk dari kiri)
  // dir: -1 = "kiri" (prev)   -> animasi bergerak ke KIRI  (lama keluar kiri, baru masuk dari kanan)
  function showLayer(newIdx, dir) {
    if (newIdx === idx) { updateMeta(); return; }
    var old = layers[idx];
    var next = layers[newIdx];
    var prevIdx = idx;

    old.classList.remove('active');
    old.style.transform = 'translateX(' + (dir >= 0 ? '28px' : '-28px') + ')';

    next.style.transform = 'translateX(0)';
    next.classList.add('active');

    idx = newIdx;
    updateMeta();

    setTimeout(function () {
      layers[prevIdx].style.transform = 'translateX(' + (dir >= 0 ? '-28px' : '28px') + ')';
    }, SLIDE_MS);
  }

  function step(dir) {
    var newIdx = (idx + dir + candidates.length) % candidates.length;
    showLayer(newIdx, dir);
    resetAuto();
  }

  function resetAuto() {
    if (auto) clearInterval(auto);
    auto = setInterval(function () {
      var newIdx = (idx + 1) % candidates.length;
      showLayer(newIdx, 1);
    }, 4000);
  }

  document.getElementById('prevBtn').onclick = function () { step(-1); };
  document.getElementById('nextBtn').onclick = function () { step(1); };

  var touchX = null;
  card.addEventListener('touchstart', function (e) { touchX = e.touches[0].clientX; });
  card.addEventListener('touchend', function (e) {
    if (touchX === null) return;
    var dx = e.changedTouches[0].clientX - touchX;
    // geser jari ke kanan (dx>0) = balik ke sebelumnya, geser ke kiri (dx<0) = lanjut ke berikutnya
    if (Math.abs(dx) > 40) { step(dx > 0 ? -1 : 1); }
    touchX = null;
  });

  pickM.onclick = function () { if (locked) return; slots.m = slots.m === idx ? null : idx; errMsg.classList.add('hidden'); updateMeta(); };
  pickF.onclick = function () { if (locked) return; slots.f = slots.f === idx ? null : idx; errMsg.classList.add('hidden'); updateMeta(); };
  undoM.onclick = function () { slots.m = null; updateMeta(); };
  undoF.onclick = function () { slots.f = null; updateMeta(); };

  function lockUI() {
    locked = true;
    if (auto) clearInterval(auto);
    card.classList.add('hidden');
    dots.classList.add('hidden');
    submitBtn.classList.add('hidden');
    lockedMsg.classList.remove('hidden');
    updateMeta();
  }

  submitBtn.onclick = function () {
    if (slots.m === null || slots.f === null) {
      errMsg.textContent = 'Pilih dulu satu warna maskulin dan satu feminin.';
      errMsg.classList.remove('hidden');
      return;
    }
    submitBtn.disabled = true;
    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ token: token, maskulin: candidates[slots.m].name, feminin: candidates[slots.f].name })
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        submitBtn.disabled = false;
        if (res.ok) {
          lockUI();
          loadLive();
        } else {
          errMsg.textContent = res.message || 'Gagal mengirim vote.';
          errMsg.classList.remove('hidden');
          if (res.maskulin) lockUI();
        }
      })
      .catch(function (err) {
        submitBtn.disabled = false;
        errMsg.textContent = 'Terjadi kesalahan: ' + err.message;
        errMsg.classList.remove('hidden');
      });
  };

  // --- hasil realtime ---
  function renderLive(el, counts, total) {
    el.innerHTML = '';
    var entries = Object.keys(counts).map(function (name) { return { name: name, n: counts[name] }; });
    entries.sort(function (a, b) { return b.n - a.n; });
    if (entries.length === 0) {
      el.innerHTML = '<p class="liveEmpty">Belum ada suara.</p>';
      return;
    }
    entries.slice(0, 3).forEach(function (e, i) {
      var cand = candidates.find(function (c) { return c.name === e.name; }) || { hex: '#ccc' };
      var pct = total > 0 ? Math.round((e.n / total) * 100) : 0;
      var row = document.createElement('div');
      row.className = 'liveRow';
      row.innerHTML =
        '<span class="rank">' + (i + 1) + '</span>' +
        '<span class="sw" style="background:' + cand.hex + '"></span>' +
        '<div class="info"><p class="name">' + e.name + '</p>' +
        '<div class="bar"><div class="bar-fill" style="width:' + pct + '%; background:' + cand.hex + '"></div></div></div>' +
        '<span class="pct">' + pct + '%</span>';
      el.appendChild(row);
    });
  }

  function loadLive() {
    fetch(API_URL + '?action=results')
      .then(function (r) { return r.json(); })
      .then(function (res) {
        renderLive(liveM, res.countM, res.total);
        renderLive(liveF, res.countF, res.total);
        liveTotal.textContent = res.total + ' suara masuk' + (res.votingOpen ? '' : ' — voting ditutup');
      })
      .catch(function () {});
  }

  // Muat data warna, lalu cek status vote sebelumnya
  fetch(API_URL + '?action=warna')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      candidates = data;
      buildLayers();
      loadingMsg.classList.add('hidden');
      app.classList.remove('hidden');
      loadLive();
      liveTimer = setInterval(loadLive, 8000);
      return fetch(API_URL + '?action=status&token=' + encodeURIComponent(token));
    })
    .then(function (r) { return r.json(); })
    .then(function (status) {
      if (status.voted) {
        slots.m = candidates.findIndex(function (c) { return c.name === status.maskulin; });
        slots.f = candidates.findIndex(function (c) { return c.name === status.feminin; });
        lockUI();
      } else {
        updateMeta();
        resetAuto();
      }
    })
    .catch(function (err) {
      loadingMsg.textContent = 'Gagal memuat data. Cek koneksi atau URL API.';
    });
</script>
</body>
</html>
